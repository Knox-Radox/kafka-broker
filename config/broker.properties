# Broker identity and network binding.
broker.id=0
listen.port=9092

# The address advertised to clients in Metadata responses. This is the
# address a client will actually *connect* to after its first request —
# it is deliberately separate from the bind address (which can be 0.0.0.0,
# a wildcard that is valid to bind but useless to connect to). Getting this
# wrong is the classic first-day bug: see PRD §5.3 (Metadata) and the
# JOURNAL.md template entry.
advertised.host=127.0.0.1
advertised.port=9092

# Pre-configured topics. M1 has no auto-creation (PRD §5.1) and no admin
# API, so topics and their partition counts are declared here at startup.
# Format: name:partitionCount
topics=test:1
