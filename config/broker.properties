# Broker identity and network binding.
broker.id=0
listen.port=9092

# The address advertised to clients in Metadata responses. This is the
# address a client will actually *connect* to after its first request —
# it is deliberately separate from the bind address (which can be 0.0.0.0,
# a wildcard that is valid to bind but useless to connect to). Getting this
# wrong is the classic first-day bug: see PRD §5.3 (Metadata) and the
# JOURNAL.md template entry.
advertised.host=127.0.0.1
advertised.port=9092

# Pre-configured topics. M1 has no auto-creation (PRD §5.1) and no admin
# API, so topics and their partition counts are declared here at startup.
# Format: name:partitionCount
# "orders" has 4 partitions specifically to exercise M3 §7.2: multiple
# partitions per topic were structurally supported since M1 (LogManager
# already loops over a configured count) but nothing exercised more than
# one until now.
topics=test:1,orders:4

# M2 storage (PRD §6.7). Each topic-partition gets its own directory under
# data.dir, named "<topic>-<partition>".
data.dir=data
log.segment.bytes=1048576
log.index.interval.bytes=4096
log.retention.bytes=-1
log.retention.ms=-1
# Durability vs. throughput (PRD §6.6, the milestone's central question):
# 1 = fsync every record (safest, slowest); raise this to trade durability
# for throughput, and measure the difference yourself before trusting it.
log.flush.interval.messages=1
log.flush.interval.ms=-1

# M3 long-polling default cap (PRD §7.6), mirroring real Kafka's own
# server-side ceiling on a client's requested max_wait_ms: a client can
# ask for less, never more.
fetch.max.wait.ms=500

# M3 consumer groups (PRD §7.4/§7.6). The internal __consumer_offsets
# topic gets its own partition count, smaller than real Kafka's default
# of 50 (small deliberately, same spirit as log.segment.bytes' small
# default — nothing at this project's scale needs 50 partitions' worth of
# offset-commit parallelism, and a smaller number is easier to reason
# about while studying it).
offsets.topic.num.partitions=8
group.min.session.timeout.ms=6000
group.max.session.timeout.ms=300000
group.rebalance.timeout.ms=60000
# Not in the PRD's own §7.6 list, but real Kafka's own
# group.initial.rebalance.delay.ms: how long a brand-new group's first
# JoinGroup waits for a second member to also show up before finalizing
# with just one. Kept deliberately short here (real Kafka defaults to
# 3000ms too) so tests and manual verification don't spend long stretches
# just waiting on this window.
group.initial.rebalance.delay.ms=3000
