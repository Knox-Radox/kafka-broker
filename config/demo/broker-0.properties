# PRD §9.5's one-command demo cluster. See broker-1/broker-2.properties for
# the general shape (identical except broker.id/ports/peers/data.dir) —
# this is broker 0's own config. Deliberately its own data.dir (data/demo/),
# separate from config/cluster/'s (data/cluster/) M4 manual-verification
# cluster, so bin/demo-cluster.sh can freely wipe and restart without
# touching anything from a manual session.
broker.id=0
listen.port=9092
advertised.host=127.0.0.1
advertised.port=9092

# A dedicated "demo" topic, 3 partitions, distinct from config/cluster's
# "test"/"orders" so a demo run's data never gets confused with M4's own
# manual-verification topics.
topics=demo:3

data.dir=data/demo/broker-0
log.segment.bytes=1048576
log.index.interval.bytes=4096
log.retention.bytes=-1
log.retention.ms=-1
log.flush.interval.messages=1
log.flush.interval.ms=-1

fetch.max.wait.ms=500

offsets.topic.num.partitions=8
group.min.session.timeout.ms=6000
group.max.session.timeout.ms=300000
group.rebalance.timeout.ms=60000
group.initial.rebalance.delay.ms=3000

# M4 replication (PRD §8.2/§8.7) — same real 3-broker, RF=3 shape as
# config/cluster/, just pointed at the demo's own topic/data.
broker.peers=1:127.0.0.1:9093,2:127.0.0.1:9094
replication.factor=3
replica.lag.time.max.ms=10000
leader.lease.renew.interval.ms=2000
leader.lease.timeout.ms=6000
replica.fetch.max.wait.ms=500
replica.fetch.min.bytes=1

metrics.port=9404
