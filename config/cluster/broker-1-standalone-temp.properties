# TEMPORARY, test-only: broker 1's exact same data.dir, but with no peers
# configured — used to manufacture genuine log divergence for the M4
# truncation-on-rejoin acceptance test (§8.8 criterion 5), standing in for
# "the old leader kept accepting writes locally while partitioned off"
# without needing OS-level network-partition tooling.
broker.id=1
listen.port=19093
advertised.host=127.0.0.1
advertised.port=19093
topics=test:1,orders:4
data.dir=data/cluster/broker-1
log.segment.bytes=1048576
log.index.interval.bytes=4096
log.retention.bytes=-1
log.retention.ms=-1
log.flush.interval.messages=1
log.flush.interval.ms=-1
fetch.max.wait.ms=500
offsets.topic.num.partitions=8
group.min.session.timeout.ms=6000
group.max.session.timeout.ms=300000
group.rebalance.timeout.ms=60000
group.initial.rebalance.delay.ms=3000
broker.peers=
replication.factor=1
metrics.port=19404
