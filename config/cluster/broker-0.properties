# M4 (PRD §8) manual acceptance-test cluster: 3 brokers, replication
# factor 3, all on localhost with distinct ports. This is broker 0's own
# config — broker.peers lists every OTHER broker, never itself.
broker.id=0
listen.port=9092
advertised.host=127.0.0.1
advertised.port=9092

topics=test:1,orders:4

data.dir=data/cluster/broker-0
log.segment.bytes=1048576
log.index.interval.bytes=4096
log.retention.bytes=-1
log.retention.ms=-1
log.flush.interval.messages=1
log.flush.interval.ms=-1

fetch.max.wait.ms=500

offsets.topic.num.partitions=8
group.min.session.timeout.ms=6000
group.max.session.timeout.ms=300000
group.rebalance.timeout.ms=60000
group.initial.rebalance.delay.ms=3000

# M4 replication (PRD §8.2/§8.7)
broker.peers=1:127.0.0.1:9093,2:127.0.0.1:9094
replication.factor=3
replica.lag.time.max.ms=10000
leader.lease.renew.interval.ms=2000
leader.lease.timeout.ms=6000
replica.fetch.max.wait.ms=500
replica.fetch.min.bytes=1

# M5 metrics (PRD §9.4) — each broker on the same host needs a distinct port.
metrics.port=9404
